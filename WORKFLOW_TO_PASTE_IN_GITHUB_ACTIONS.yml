name: Refresh publications and translations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-research-data.yml'

permissions:
  contents: write

concurrency:
  group: publication-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install updater requirements
        run: pip install -r requirements.txt

      - name: Refresh publication index, translations and publication visuals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/update_publications.py

      - name: Refresh Journal Impact Factor when a licensed feed is configured
        env:
          JCR_JSON_URL: ${{ secrets.JCR_JSON_URL }}
        run: python scripts/update_journal_metrics.py

      - name: Commit refreshed research data
        run: |
          git config user.name "lab-publication-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json data/publications.js assets/publications
          git diff --cached --quiet || git commit -m "Auto-update publications and translations"
          git pull --rebase
          git push
